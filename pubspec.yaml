name: easy_container
description: An easy to use container for flutter with built in gesture detectors and a lot of customization.
version: 1.2.0
homepage: https://github.com/rithik-dev/easy_container
repository: https://github.com/rithik-dev/easy_container
issue_tracker: https://github.com/rithik-dev/easy_container/issues
documentation: https://github.com/rithik-dev/easy_container/blob/master/README.md

# Kept under example/ rather than .github/ with the README's other images, because screenshots have
# to ship inside the published archive: pub.dev builds the search thumbnail and the package page
# gallery from the file it actually receives, and it excludes hidden directories. A path under
# .github/ fails silently, since `pub publish --dry-run` only checks the file exists on disk.
# The flip side is that everyone depending on this package downloads it, so keep it small.
screenshots:
  - description: 'EasyContainers with different padding, colors, elevations and border radii.'
    path: example/screenshots/containers.webp

topics: 
  - flutter
  - widget
  - gesture
  - container
  - card

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
