name: easy_container
description: An easy to use container for flutter with built in gesture detectors and a lot of customization.
version: 1.2.3
homepage: https://github.com/rithik-dev/easy_container
repository: https://github.com/rithik-dev/easy_container
issue_tracker: https://github.com/rithik-dev/easy_container/issues
documentation: https://github.com/rithik-dev/easy_container/blob/master/README.md

# Path must point under screenshots/published/, not screenshots/unpublished/ (see the .pubignore
# in that folder) or any hidden directory: pub.dev builds the search thumbnail and the package page
# gallery from the file it actually receives, and `pub publish --dry-run` does not warn if the path
# resolves locally but is excluded from what gets published — this fails silently.
screenshots:
  - description: 'EasyContainers with different padding, colors, elevations and border radii.'
    path: screenshots/published/containers.webp

topics: 
  - flutter
  - widget
  - gesture
  - container
  - card

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
